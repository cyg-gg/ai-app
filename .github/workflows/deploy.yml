# ============================================================
# GitHub Actions — 自动构建 Docker 镜像并部署到阿里云 ECS
# 策略：CI 构建 → docker save → rsync(over SSH) 传输到 ECS → docker load 启动
# ============================================================

name: Deploy to Alibaba Cloud ECS

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      # ── 1. 检出代码 ──────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4

      # ── 2. 设置 Docker Buildx ────────────────────────────────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── 3. 缓存 Docker 层 ────────────────────────────────────
      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      # ── 4. 构建镜像（在 CI 机器上）───────────────────────────
      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: ai-app:latest
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max

      - name: Move cache
        run: rm -rf /tmp/.buildx-cache && mv /tmp/.buildx-cache-new /tmp/.buildx-cache

      # ── 5. 导出镜像为 tar.gz ────────────────────────────────
      - name: Export image to tar
        run: |
          docker save ai-app:latest | gzip > /tmp/ai-app.tar.gz
          echo "IMAGE_SIZE=$(du -sh /tmp/ai-app.tar.gz | cut -f1)" >> $GITHUB_STEP_SUMMARY

      # ── 6. 安装 SSH Key + 用 rsync 传输镜像 + 部署 ─────────
      - name: Deploy to ECS via SSH (rsync)
        env:
          HOST: ${{ secrets.SSH_HOST }}
          PORT: ${{ secrets.SSH_PORT || '22' }}
          USER: ${{ secrets.SSH_USERNAME }}
          KEY_PATH: /tmp/ssh_key
        run: |
          set -e

          # ---- 写入 SSH 私钥 ----
          echo "${{ secrets.SSH_PRIVATE_KEY }}" | tr -d '\r' > ${KEY_PATH}
          chmod 600 ${KEY_PATH}

          SSH_OPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -p ${PORT} -i ${KEY_PATH}"

          echo "========================================"
          echo "  开始部署 AI App — $(date '+%Y-%m-%d %H:%M:%S')"
          echo "========================================"

          # ---- 在服务器上创建目录并写入 .env ----
          ssh ${SSH_OPTS} ${USER}@${HOST} "mkdir -p /root/deploy/data /root/deploy/uploads && cat > /root/deploy/.env << 'ENVEOF'
          ${{ secrets.APP_ENV }}
          ENVEOF
          "
          echo "✅ .env 已写入"

          # ---- 用 rsync 通过 SSH 传输 tar 文件 ----
          echo "📤 传输镜像到 ECS..."
          rsync -avz -e "ssh ${SSH_OPTS}" /tmp/ai-app.tar.gz ${USER}@${HOST}:/root/deploy/ai-app.tar.gz

          # ---- 远程加载镜像并部署容器 ----
          ssh ${SSH_OPTS} ${USER}@${HOST} '
            set -e

            # 加载新镜像
            echo "📦 加载 Docker 镜像..."
            docker load < /root/deploy/ai-app.tar.gz
            rm -f /root/deploy/ai-app.tar.gz

            # 停止旧容器
            echo "🛑 停止旧容器..."
            docker stop ai-app 2>/dev/null || true
            docker rm   ai-app 2>/dev/null || true

            # 启动新容器
            echo "🚀 启动新容器..."
            docker run -d \
              --name ai-app \
              --restart unless-stopped \
              -p 3000:3000 \
              --env-file /root/deploy/.env \
              -v /root/deploy/data:/app/server/data \
              -v /root/deploy/uploads:/app/server/uploads \
              ai-app:latest

            # 清理旧镜像
            echo "🧹 清理旧镜像..."
            docker image prune -f

            # 健康检查
            echo "⏳ 等待服务就绪..."
            sleep 5
            for i in 1 2 3 4 5; do
              STATUS=$(curl -sf http://localhost:3000/health 2>/dev/null | python3 -c "import sys,json; print(json.load(sys.stdin).get(\"status\",\"pending\"))" 2>/dev/null || echo "pending")
              if [ "$STATUS" = "ok" ]; then
                echo "✅ 健康检查通过！服务已就绪"
                break
              fi
              echo "  第 $i 次... 等待 3s"
              sleep 3
            done

            echo "========================================"
            echo "  部署完成！"
            docker ps --filter name=ai-app --format "{{.Names}} | {{.Status}} | {{.Ports}}"
            echo "========================================"
          '

          # 清理本地私钥
          rm -f ${KEY_PATH}
