# ============================================================
# GitHub Actions — 自动构建 Docker 镜像并部署到阿里云 ECS
# 策略：CI 构建 → GitHub Artifact 中转 → 原生 scp 命令传输 → SSH 部署
# ============================================================

name: Deploy to Alibaba Cloud ECS

on:
  push:
    branches: [main]

jobs:
  build:
    name: Build Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: ai-app:latest
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max

      - name: Move cache
        run: rm -rf /tmp/.buildx-cache && mv /tmp/.buildx-cache-new /tmp/.buildx-cache

      - name: Export image to tar
        run: |
          docker save ai-app:latest | gzip > /tmp/ai-app.tar.gz
          echo "IMAGE_SIZE=$(du -sh /tmp/ai-app.tar.gz | cut -f1)"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: /tmp/ai-app.tar.gz
          retention-days: 1

  deploy:
    name: Deploy to ECS
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: ./deploy-artifact

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          cat >> ~/.ssh/config <<EOF
          Host ecs
            HostName ${{ secrets.SSH_HOST }}
            User ${{ secrets.SSH_USERNAME }}
            Port ${{ secrets.SSH_PORT || '22' }}
            IdentityFile ~/.ssh/deploy_key
            StrictHostKeyChecking no
          EOF
          chmod 600 ~/.ssh/config

      - name: Upload .env to ECS
        run: |
          cat > /tmp/app.env << 'EOF'
          ${{ secrets.APP_ENV }}
          EOF
          scp /tmp/app.env ecs:/root/deploy/app.env

      - name: Upload image to ECS (split transfer)
        run: |
          # 分片传输大文件，避免 scp 超时
          split -b 50M ./deploy-artifact/ai-app.tar.gz /tmp/ai-app.part-
          scp /tmp/ai-app.part-* ecs:/root/deploy/
          ssh ecs "cat /root/deploy/ai-app.part-* > /root/deploy/ai-app.tar.gz && rm /root/deploy/ai-app.part-*"

      - name: Deploy on ECS
        run: |
          ssh ecs '
            set -e
            echo "========================================"
            echo "  开始部署 AI App"
            echo "========================================"

            mkdir -p /root/deploy/data /root/deploy/uploads

            echo "📦 加载 Docker 镜像..."
            docker load < /root/deploy/ai-app.tar.gz
            rm -f /root/deploy/ai-app.tar.gz

            echo "🛑 停止旧容器..."
            docker stop ai-app 2>/dev/null || true
            docker rm ai-app 2>/dev/null || true

            echo "🚀 启动新容器..."
            docker run -d --name ai-app --restart unless-stopped \
              -p 3000:3000 --env-file /root/deploy/app.env \
              -v /root/deploy/data:/app/server/data \
              -v /root/deploy/uploads:/app/server/uploads \
              ai-app:latest

            docker image prune -f

            echo "⏳ 等待服务就绪..."
            sleep 5
            for i in $(seq 1 5); do
              if curl -sf http://localhost:3000/health >/dev/null 2>&1; then
                echo "✅ 服务已就绪"; break
              fi; sleep 3
            done

            docker ps --filter name=ai-app
            echo "🎉 部署完成 http://${{ secrets.SSH_HOST }}:3000"
          '
