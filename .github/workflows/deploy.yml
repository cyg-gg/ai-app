# ============================================================
# GitHub Actions — 自动部署到阿里云 ECS
# ============================================================

name: Deploy to Alibaba Cloud ECS

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      # 1. 检出代码
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. 设置 SSH Agent
      - name: Setup SSH Agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      # 3. 添加主机密钥并测试连接
      - name: Test SSH Connection
        run: |
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10 ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} "echo 'SSH connection successful!'"

      # 4. 打包并传输代码
      - name: Transfer code
        run: |
          tar -czf /tmp/ai-app.tar.gz \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='dist' \
            --exclude='.env' \
            --exclude='server/data' \
            .
          scp /tmp/ai-app.tar.gz ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}:/root/ai-app.tar.gz

      # 5. 在 ECS 上部署
      - name: Deploy
        run: |
          ssh ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} << 'ENDSSH'
            set -e
            echo "🚀 开始部署..."
            rm -rf /root/ai-app
            mkdir -p /root/ai-app
            tar -xzf /root/ai-app.tar.gz -C /root/ai-app
            rm -f /root/ai-app.tar.gz
            cd /root/ai-app
            
            docker stop ai-app 2>/dev/null || true
            docker rm ai-app 2>/dev/null || true
            
            docker build -t ai-app:latest .
            
            docker run -d \
              --name ai-app \
              --restart unless-stopped \
              -p 3000:3000 \
              --env-file /root/ai-app/.env \
              -v /root/ai-app/data:/app/server/data \
              ai-app:latest
            
            docker image prune -f
            docker builder prune -f
            
            echo "✅ 部署完成！"
            docker ps --filter name=ai-app
          ENDSSH
