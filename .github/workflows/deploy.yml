# ============================================================
# GitHub Actions — 自动部署到阿里云 ECS
# ============================================================

name: Deploy to Alibaba Cloud ECS

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to ECS
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY_B64 }}" | base64 -d > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo -e "Host *\n\tStrictHostKeyChecking no\n\tUserKnownHostsFile /dev/null" > ~/.ssh/config
          chmod 600 ~/.ssh/config

          SSH_KEY=~/.ssh/id_ed25519
          SSH_USER=${{ secrets.SSH_USERNAME }}
          SSH_HOST=${{ secrets.SSH_HOST }}
          SSH_PORT=${{ secrets.SSH_PORT || '22' }}

          echo "测试 SSH 连接..."
          ssh -i $SSH_KEY -p $SSH_PORT $SSH_USER@$SSH_HOST "echo SSH连接成功"

          echo "打包代码..."
          tar -czf /tmp/ai-app.tar.gz \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='dist' \
            --exclude='.env' \
            --exclude='server/data' \
            .

          echo "传输代码到 ECS..."
          scp -i $SSH_KEY -P $SSH_PORT /tmp/ai-app.tar.gz $SSH_USER@$SSH_HOST:/root/ai-app.tar.gz

          echo "在 ECS 上执行部署..."
          ssh -i $SSH_KEY -p $SSH_PORT $SSH_USER@$SSH_HOST "bash -s" << 'ENDSCRIPT'
set -e
echo "开始部署 AI Studio..."
echo "解压代码..."
rm -rf /root/ai-app
mkdir -p /root/ai-app
tar -xzf /root/ai-app.tar.gz -C /root/ai-app
rm -f /root/ai-app.tar.gz
cd /root/ai-app
echo "停止旧容器..."
docker stop ai-app 2>/dev/null || true
docker rm ai-app 2>/dev/null || true
echo "构建 Docker 镜像..."
docker build -t ai-app:latest .
echo "启动新容器..."
docker run -d --name ai-app --restart unless-stopped -p 3000:3000 --env-file /root/ai-app/.env -v /root/ai-app/data:/app/server/data ai-app:latest
echo "清理..."
docker image prune -f
docker builder prune -f
echo "部署完成！"
docker ps --filter name=ai-app --format "容器状态: {{.Status}}"
ENDSCRIPT

          echo "部署完成！访问地址: http://${{ secrets.SSH_HOST }}:3000"
