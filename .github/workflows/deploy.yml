# ============================================================
# GitHub Actions — 自动构建 Docker 镜像并部署到阿里云 ECS
# 策略：CI 构建 → Artifact 中转 → SSH 密码登录传输 + 部署
# ============================================================

name: Deploy to Alibaba Cloud ECS

on:
  push:
    branches: [main]

jobs:
  build:
    name: Build Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: ai-app:latest
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max

      - name: Move cache
        run: rm -rf /tmp/.buildx-cache && mv /tmp/.buildx-cache-new /tmp/.buildx-cache

      - name: Export image to tar
        run: |
          docker save ai-app:latest | gzip > /tmp/ai-app.tar.gz
          echo "IMAGE_SIZE=$(du -sh /tmp/ai-app.tar.gz | cut -f1)"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: /tmp/ai-app.tar.gz
          retention-days: 1

  deploy:
    name: Deploy to ECS
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: ./deploy-artifact

      # 安装 sshpass 工具（支持密码登录）
      - name: Install sshpass
        run: sudo apt-get update && sudo apt-get install -y sshpass

      # 写入 .env 文件
      - name: Prepare .env file
        run: printf '%s\n' "${{ secrets.APP_ENV }}" > /tmp/app.env

      # 用密码方式测试连接 + 上传文件 + 部署（全部一步完成）
      - name: Transfer and Deploy to ECS
        env:
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
        run: |
          set -e

          HOST="${{ secrets.SSH_HOST }}"
          PORT="${{ secrets.SSH_PORT || '22' }}"
          USER="${{ secrets.SSH_USERNAME }}"

          echo "========================================"
          echo "  步骤1: 测试 SSH 连接"
          echo "========================================"
          sshpass -e ssh -o StrictHostKeyChecking=no -p $PORT $USER@$HOST "
            echo '✅ SSH 连接成功!'
            hostname
            docker --version
          "

          echo ""
          echo "========================================"
          echo "  步骤2: 上传 .env 文件"
          echo "========================================"
          sshpass -e scp -o StrictHostKeyChecking=no -P $PORT /tmp/app.env $USER@$HOST:/root/deploy/app.env
          echo "✅ .env 已上传"

          echo ""
          echo "========================================"
          echo "  步骤3: 分片上传镜像 tar 包 (每片50MB)"
          echo "========================================"
          split -b 50M ./deploy-artifact/ai-app.tar.gz /tmp/ai-app.part-
          PART_COUNT=$(ls /tmp/ai-app.part-* | wc -l)
          echo "共 $PART_COUNT 个分片"

          for PART in /tmp/ai-app.part-*; do
            sshpass -e scp -o StrictHostKeyChecking=no -P $PORT "$PART" $USER@$HOST:/root/deploy/
          done
          rm -f /tmp/ai-app.part-*

          # 在服务器上合并分片
          sshpass -e ssh -o StrictHostKeyChecking=no -p $PORT $USER@$HOST "
            cat /root/deploy/ai-app.part-* > /root/deploy/ai-app.tar.gz
            rm -f /root/deploy/ai-app.part-*
            echo ✅ 镜像已上传 (\$(du -sh /root/deploy/ai-app.tar.gz | cut -f1))
          "

          echo ""
          echo "========================================"
          echo "  步骤4: 部署容器"
          echo "========================================"
          sshpass -e ssh -o StrictHostKeyChecking=no -p $PORT $USER@$HOST '
            set -e

            mkdir -p /root/deploy/data /root/deploy/uploads

            echo "📦 加载 Docker 镜像..."
            docker load < /root/deploy/ai-app.tar.gz
            rm -f /root/deploy/ai-app.tar.gz

            echo "🛑 停止旧容器..."
            docker stop ai-app 2>/dev/null || true
            docker rm ai-app 2>/dev/null || true

            echo "🚀 启动新容器..."
            docker run -d --name ai-app --restart unless-stopped \
              -p 3000:3000 --env-file /root/deploy/app.env \
              -v /root/deploy/data:/app/server/data \
              -v /root/deploy/uploads:/app/server/uploads \
              ai-app:latest

            docker image prune -f

            echo "⏳ 等待服务就绪..."
            sleep 5
            for i in 1 2 3 4 5; do
              if curl -sf http://localhost:3000/health >/dev/null 2>&1; then
                echo "✅ 服务已就绪"; break
              fi; sleep 3
            done

            echo ""
            echo "========================================="
            echo "  容器状态:"
            docker ps --filter name=ai-app
            echo "========================================="
            echo "🎉 部署完成!"
          '
