name: Deploy to Alibaba Cloud ECS

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY_B64 }}" | base64 -d > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Create deploy script
        run: |
          cat > /tmp/deploy.sh << 'SCRIPT'
          #!/bin/bash
          set -e
          echo "开始部署 AI Studio..."
          echo "解压代码..."
          rm -rf /root/ai-app
          mkdir -p /root/ai-app
          tar -xzf /root/ai-app.tar.gz -C /root/ai-app
          rm -f /root/ai-app.tar.gz
          cd /root/ai-app
          echo "停止旧容器..."
          docker stop ai-app 2>/dev/null || true
          docker rm ai-app 2>/dev/null || true
          echo "构建 Docker 镜像..."
          docker build -t ai-app:latest .
          echo "启动新容器..."
          docker run -d --name ai-app --restart unless-stopped -p 3000:3000 --env-file /root/ai-app/.env -v /root/ai-app/data:/app/server/data ai-app:latest
          echo "清理..."
          docker image prune -f
          docker builder prune -f
          echo "部署完成！"
          docker ps --filter name=ai-app --format "容器状态: {{.Status}}"
          SCRIPT
          chmod +x /tmp/deploy.sh

      - name: Transfer deploy script to ECS
        run: |
          scp -i ~/.ssh/id_ed25519 -P ${{ secrets.SSH_PORT || '22' }} /tmp/deploy.sh ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}:/root/deploy.sh

      - name: Package code
        run: |
          tar -czf /tmp/ai-app.tar.gz \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='dist' \
            --exclude='server/data' \
            .
          ls -lh /tmp/ai-app.tar.gz

      - name: Transfer code to ECS
        run: |
          scp -i ~/.ssh/id_ed25519 -P ${{ secrets.SSH_PORT || '22' }} /tmp/ai-app.tar.gz ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}:/root/ai-app.tar.gz

      - name: Run deploy on ECS
        run: |
          ssh -i ~/.ssh/id_ed25519 -p ${{ secrets.SSH_PORT || '22' }} ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} "bash /root/deploy.sh"

      - name: Show access URL
        run: echo "部署完成！访问地址: http://${{ secrets.SSH_HOST }}:3000"
