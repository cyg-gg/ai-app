# ============================================================
# GitHub Actions — 自动部署到阿里云 ECS
# ============================================================

name: Deploy to Alibaba Cloud ECS

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      # 1. 检出代码
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. 配置 SSH 并传输代码
      - name: Setup SSH and Transfer
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY_B64 }}" | base64 -d > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo -e "Host *\n\tStrictHostKeyChecking no\n\tUserKnownHostsFile /dev/null" > ~/.ssh/config
          chmod 600 ~/.ssh/config
          echo "测试 SSH 连接..."
          ssh -i ~/.ssh/id_ed25519 ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} "echo SSH连接成功"
          echo "打包代码..."
          tar -czf /tmp/ai-app.tar.gz --exclude='.git' --exclude='node_modules' --exclude='dist' --exclude='.env' --exclude='server/data' .
          echo "传输代码到 ECS..."
          scp -i ~/.ssh/id_ed25519 /tmp/ai-app.tar.gz ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}:/root/ai-app.tar.gz
          echo "传输完成!"

      # 3. SSH 登录 ECS，解压代码、构建 Docker 镜像并启动容器
      - name: Build and run Docker on ECS
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || '22' }}
          script: |
            set -e
            echo "🚀 开始部署 AI Studio..."
            echo "📦 解压代码..."
            rm -rf /root/ai-app
            mkdir -p /root/ai-app
            tar -xzf /root/ai-app.tar.gz -C /root/ai-app
            rm -f /root/ai-app.tar.gz
            cd /root/ai-app
            echo "🛑 停止旧容器..."
            docker stop ai-app 2>/dev/null || true
            docker rm ai-app 2>/dev/null || true
            echo "🐳 构建 Docker 镜像..."
            docker build -t ai-app:latest .
            echo "🐳 启动新容器..."
            docker run -d --name ai-app --restart unless-stopped -p 3000:3000 --env-file /root/ai-app/.env -v /root/ai-app/data:/app/server/data ai-app:latest
            echo "🧹 清理..."
            docker image prune -f
            docker builder prune -f
            echo "✅ 部署完成！"
            docker ps --filter name=ai-app --format "容器状态: {{.Status}}"
            echo "🌐 访问地址: http://${{ secrets.SSH_HOST }}:3000"
