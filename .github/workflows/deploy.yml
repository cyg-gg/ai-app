# ============================================================
# GitHub Actions — 自动构建 Docker 镜像并部署到阿里云 ECS
# 策略：CI 构建 → docker save → GitHub Artifact 中转 → SSH 下载 → docker load 启动
# ============================================================

name: Deploy to Alibaba Cloud ECS

on:
  push:
    branches: [main]

jobs:
  build:
    name: Build Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: ai-app:latest
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max

      - name: Move cache
        run: rm -rf /tmp/.buildx-cache && mv /tmp/.buildx-cache-new /tmp/.buildx-cache

      - name: Export image to tar
        run: |
          docker save ai-app:latest | gzip > /tmp/ai-app.tar.gz
          echo "IMAGE_SIZE=$(du -sh /tmp/ai-app.tar.gz | cut -f1)"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: /tmp/ai-app.tar.gz
          retention-days: 1

  deploy:
    name: Deploy to ECS
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: /tmp

      # 把 .env 写入本地文件（避免通过 SSH 参数传递）
      - name: Prepare .env file
        run: |
          cat > /tmp/app.env << 'EOF'
          ${{ secrets.APP_ENV }}
          EOF

      # 用 appleboy/ssh-action 在 ECS 上执行命令
      # 同时用 appleboy/scp-action 传输文件（这次用相对路径）
      - name: Upload files to ECS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || '22' }}
          source: "/tmp/ai-app.tar.gz,/tmp/app.env"
          target: "/root/deploy/"
          overwrite: true

      - name: Deploy on ECS
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || '22' }}
          command_timeout: 10m
          script: |
            set -e

            echo "========================================"
            echo "  开始部署 AI App"
            echo "========================================"

            mkdir -p /root/deploy/data /root/deploy/uploads

            echo "📦 加载 Docker 镜像..."
            docker load < /root/deploy/ai-app.tar.gz
            rm -f /root/deploy/ai-app.tar.gz

            echo "🛑 停止旧容器..."
            docker stop ai-app 2>/dev/null || true
            docker rm ai-app 2>/dev/null || true

            echo "🚀 启动新容器..."
            docker run -d --name ai-app --restart unless-stopped \
              -p 3000:3000 --env-file /root/deploy/app.env \
              -v /root/deploy/data:/app/server/data \
              -v /root/deploy/uploads:/app/server/uploads \
              ai-app:latest

            docker image prune -f

            echo "⏳ 等待服务就绪..."
            sleep 5
            for i in $(seq 1 5); do
              if curl -sf http://localhost:3000/health >/dev/null 2>&1; then
                echo "✅ 服务已就绪"; break
              fi; sleep 3
            done

            docker ps --filter name=ai-app
            echo "🎉 部署完成 http://${{ secrets.SSH_HOST }}:3000"
